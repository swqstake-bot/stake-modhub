# Build + electron-builder --publish → GitHub Release + latest.yml (electron-updater).
# Wird bei Push eines Tags v* ausgeführt.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Kollegen-ZIP (Packager, ohne Auto-Update)
        shell: pwsh
        run: npm run dist

      - name: Kollegen-ZIP sichern
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path dist -Filter "Stake-ModHub-*-Windows.zip" | Select-Object -First 1
          if (-not $zip) { throw "Kein Kollegen-ZIP in dist/" }
          Copy-Item $zip.FullName "$env:RUNNER_TEMP\Stake-ModHub-Kollegen.zip"

      - name: Build & publish portable (electron-updater + latest.yml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:publish

      - name: Kollegen-ZIP zum Release hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release upload $tag "$env:RUNNER_TEMP\Stake-ModHub-Kollegen.zip" --clobber
