name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows ZIP (Packager — Kollegen-Paket)
        shell: pwsh
        run: npm run dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = Get-ChildItem -Path dist -Filter "Stake-ModHub-*.zip" | Select-Object -First 1
          if (-not $zip) { throw "Kein ZIP in dist/ — Build fehlgeschlagen?" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Stake Mod Hub $tag" --notes @"
          ## Installation
          1. **ZIP entpacken** (kompletter Ordner)
          2. **START.bat** oder **Stake Mod Hub.exe** starten
          3. SmartScreen: *Weitere Informationen* → *Trotzdem ausführen*

          Nicht `npm start` — nur die entpackte App.
          "@
          }
          gh release upload $tag $zip.FullName --clobber
          gh release edit $tag --draft=false
